###############################################################################
#                             APPLICATION CONFIG                              #
###############################################################################

# Development options
# debug: true


spring:
  aop:
    proxy-target-class: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
          jwk-set-uri:

# Security client
security:
  oauth:
    realm:
    server:
      url:
    admin:
      url:
      clientId:
      username:
      password:
      realm:

# Actuators

# All actuators are exposed through HTTP for this example
management:
  endpoints:
    web:
      exposure:
        include: health,auditevents
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    auditevents:
      enabled: true

